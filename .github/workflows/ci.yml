name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  test-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Test Bash script syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh

      - name: Test PowerShell script syntax
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = "Stop"
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/install.ps1"),
            [ref]$null,
            [ref]$null
          )
          Write-Host "PowerShell syntax check passed"

      - name: Verify tool installer scripts
        if: runner.os != 'Windows'
        run: |
          for script in installers/*/install.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" && echo "OK: $script"
            fi
          done

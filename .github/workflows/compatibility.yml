name: Compatibility Test

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:  # Manual trigger

jobs:
  test-platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tool: [claudecode, ollama, continue]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test tool detection
        run: |
          node -e "
          const { EnvironmentDetector } = require('./dist/core/env-detector');
          const detector = new EnvironmentDetector();
          detector.detect().then(env => {
            console.log('Platform:', env.platform);
            console.log('Node:', env.hasNode);
            console.log('Python:', env.hasPython);
            console.log('Git:', env.hasGit);
            console.log('Docker:', env.hasDocker);
          });
          "

      - name: Test Bash script
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh

      - name: Test PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/install.ps1', [ref]$null, [ref]$null
          )

  test-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
